<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>身体空間型 認知トレーニング</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap');

/* ============================================================
   かさなりの順番（z-index）
   数字が大きいほど手前。
      20  左右の矢印
      14  ホーム本体
   ============================================================ */

:root{
  --fJP:'M PLUS Rounded 1c',system-ui,sans-serif;
  --fDisp:'Baloo 2','M PLUS Rounded 1c',sans-serif;
  --bg:#FFF3D6; --stage:#FFFBEF; --panel:#FFFFFF;
  --stroke:#221E18; --ink:#221E18; --dim:#6E665A;
  --violet:#7C3AED; --blue:#1B6EF3; --amber:#FF8A00; --pink:#E8467C; --teal:#0E9F9F;
  --hard:6px 6px 0 var(--stroke);
  --hard-sm:4px 4px 0 var(--stroke);
  --bw:4px;
}
body[data-theme="dark"]{
  --bg:#12131C; --stage:#1A1C28; --panel:#232636;
  --stroke:#FFF6E0; --ink:#FFF6E0; --dim:#9AA0B5;
  --violet:#B98BFF; --blue:#4D9BFF; --amber:#FFB03A; --pink:#FF7BA6; --teal:#3FD3D3;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--fJP);font-weight:700;
  -webkit-font-smoothing:antialiased;user-select:none;transition:background .3s,color .3s}

.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--stage);transition:background .3s}
.frame{position:absolute;inset:16px;border:var(--bw) solid var(--stroke);border-radius:24px;pointer-events:none;z-index:2}

.wrap{position:absolute;inset:16px;z-index:14;display:flex;align-items:stretch;justify-content:center}
.pc{text-align:center;max-width:1400px;width:100%;padding:3.4vh 20px;
  display:flex;flex-direction:column;justify-content:center}

.title{font-weight:900;font-size:clamp(28px,calc(7.6vh * var(--ui)),228px);line-height:1.14;letter-spacing:.01em}
.title .hl{color:var(--violet)}
.lead{font-size:clamp(12px,calc(2vh * var(--ui)),49px);font-weight:500;color:var(--dim);line-height:1.7;margin-top:1.2vh}

/* ---------- カルーセル ---------- */
.carousel{position:relative;margin-top:3.2vh;display:flex;align-items:center;gap:1.4vh}
.track{flex:1;display:flex;gap:2vh;overflow-x:auto;scroll-behavior:smooth;
  scroll-snap-type:x mandatory;padding:1.4vh .8vh 2vh;
  scrollbar-width:none;-ms-overflow-style:none}
.track::-webkit-scrollbar{display:none}

.card{flex:0 0 clamp(230px,calc(19vw * var(--ui)),820px);scroll-snap-align:start;
  background:var(--panel);border:var(--bw) solid var(--stroke);border-radius:22px;
  padding:2.4vh 2vh;text-align:center;cursor:pointer;box-shadow:var(--hard);
  display:flex;flex-direction:column;align-items:center;gap:1.4vh;
  transition:transform .12s,box-shadow .12s}
.card:active{transform:translate(6px,6px);box-shadow:0 0 0 var(--stroke)}
.card.soon{cursor:default;opacity:.45;box-shadow:none;border-style:dashed}
.card.soon:active{transform:none}

.cHead{display:flex;align-items:center;justify-content:center;gap:1.4vh}
.cIcon{width:clamp(34px,calc(5.2vh * var(--ui)),145px);height:clamp(34px,calc(5.2vh * var(--ui)),145px);display:block;flex-shrink:0}
.cIcon [stroke]{stroke:currentColor}
.cIcon [fill]:not([fill="none"]){fill:currentColor}
.cName{font-family:var(--fDisp);font-weight:800;font-size:clamp(16px,calc(2.9vh * var(--ui)),83px);
  line-height:1.05;min-width:0}
.card.a .cIcon,.card.a .cName{color:var(--violet)}
.card.b .cIcon,.card.b .cName{color:var(--blue)}
.card.c .cIcon,.card.c .cName{color:var(--amber)}
.card.d .cIcon,.card.d .cName{color:var(--pink)}
.card.e .cIcon,.card.e .cName{color:var(--teal)}
.cSkill{display:inline-block;font-size:clamp(11px,calc(1.8vh * var(--ui)),44px);
  border:3px solid var(--stroke);border-radius:100px;padding:.5vh 1.6vh}
.cDesc{font-size:clamp(13px,calc(2.1vh * var(--ui)),57px);font-weight:700;line-height:1.5}
.cGo{margin-top:auto;width:100%;text-align:center;font-weight:900;
  font-size:clamp(15px,calc(2.3vh * var(--ui)),62px);color:#fff;background:var(--violet);
  border:3px solid var(--stroke);border-radius:100px;padding:1.3vh 1vh;
  box-shadow:3px 3px 0 var(--stroke)}
.card.b .cGo{background:var(--blue)}
.card.c .cGo{background:var(--amber)}
.card.d .cGo{background:var(--pink)}
.card.e .cGo{background:var(--teal)}
.card.soon .cGo{background:transparent;color:var(--dim);border-style:dashed;box-shadow:none}

.nav{flex:0 0 auto;width:clamp(46px,calc(6.6vh * var(--ui)),182px);height:clamp(46px,calc(6.6vh * var(--ui)),182px);
  border-radius:50%;background:var(--panel);border:var(--bw) solid var(--stroke);
  box-shadow:var(--hard-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .12s,box-shadow .12s,opacity .2s}
.nav:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--stroke)}
.nav svg{width:46%;height:46%;stroke:var(--ink);stroke-width:6;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.nav[disabled]{opacity:.25;pointer-events:none}

.dots{display:flex;gap:1.2vh;justify-content:center;margin-top:1.4vh}
.dots i{width:clamp(9px,calc(1.3vh * var(--ui)),36px);height:clamp(9px,calc(1.3vh * var(--ui)),36px);border-radius:50%;
  border:3px solid var(--stroke);background:transparent;cursor:pointer;transition:background .2s}
.dots i.on{background:var(--stroke)}

@media (max-width:760px){.nav{display:none}.card{flex-basis:74vw}}

/* ============================================================
   TOUCHLESS LAYER — 空間デバイス（非接触）向けの共通レイヤー
   1) ポインタ球体：センサーが動きを検知したときだけ現れる
   2) 透明反応エリア：見た目は変えず、当たり判定だけ広げる
   3) 連打対策・中断ボタン（JS側）
   色は --tl にまとめてあるので、ここを変えれば球体の色が変わる
   ============================================================ */
:root{--tl:#FF8A00; --tl-lt:#FFD9A3; --tlSize:9vh}
body[data-theme="dark"]{--tl:#FFB03A; --tl-lt:#FFE6B8}

.tlPointer{position:fixed;left:0;top:0;width:var(--tlSize);height:var(--tlSize);
  margin:calc(var(--tlSize) * -0.5) 0 0 calc(var(--tlSize) * -0.5);
  pointer-events:none;z-index:40;opacity:0;transition:opacity .22s;will-change:transform}
.tlPointer.on{opacity:1}
.tlCore{width:100%;height:100%;border-radius:50%;transition:transform .09s cubic-bezier(.2,1.6,.4,1);
  background:radial-gradient(circle at 38% 34%,
    color-mix(in srgb,var(--tl-lt) 92%,transparent),
    color-mix(in srgb,var(--tl) 58%,transparent) 42%,
    color-mix(in srgb,var(--tl) 16%,transparent) 70%,
    transparent 72%);
  box-shadow:0 0 2.6vh color-mix(in srgb,var(--tl) 38%,transparent)}
.tlPointer.down .tlCore{transform:scale(.72)}
.tlRipple{position:fixed;width:var(--tlSize);height:var(--tlSize);
  margin:calc(var(--tlSize) * -0.5) 0 0 calc(var(--tlSize) * -0.5);
  border-radius:50%;border:4px solid color-mix(in srgb,var(--tl) 75%,transparent);
  pointer-events:none;z-index:39;animation:tlRip .55s ease-out forwards}
@keyframes tlRip{to{transform:scale(2.3);opacity:0}}
.reduced .tlRipple{display:none}

/* 透明反応エリア：::before を要素の外側まで広げる。
   透明なので見た目はそのまま、当たり判定だけ大きくなる。
   隣り合うボタン同士は、すき間の半分弱まで。残りは JS の吸着が受け持つ */
.btn,.rp{position:relative}   /* .gear .brand .mole .abort はもともと absolute */
.btn::before,.rp::before{content:'';position:absolute;inset:-2.2vh -2.4vh;border-radius:inherit}
.gear::before,.brand::before{content:'';position:absolute;inset:-1.8vh -2vh;border-radius:inherit}
.opt::before{content:'';position:absolute;inset:-.9vh -.7vh;border-radius:inherit}
.opt{position:relative}
.mole::before{content:'';position:absolute;inset:-20% -16%;border-radius:50%}
.tok.tappable::before{content:'';position:absolute;inset:-16%;border-radius:40%}
.target::after{inset:-22%}
/* 中断直後：手がまだトントンしているので、同じ位置のボタンを一時的に無効化 */
.tlCooldown .brand,.tlCooldown .gear,.tlCooldown .abort{pointer-events:none;opacity:.35}

/* ============================================================
   大画面向けスケール
   文字・ボタン・的の大きさは clamp(…vh…) に --ui を掛けて一括で拡大
   （ビルド時に書き換え）。--ui は ?ui=1.4 のようにURLでも変えられる。
   ============================================================ */
:root{--ui:1.3}
/* ボタン同士の間隔を広げる（タッチレスでは隣に手が届きやすい） */
.optRow{gap:2.8vh}
.opt{min-height:calc(9vh * var(--ui))}
.setBlock{margin-bottom:2.6vh;gap:3vh}
.setLabel{flex-basis:6em}
.rulepair{gap:4vh;margin-bottom:3vh}
.rp{width:min(360px,30vw)}
.res-grid{gap:2.6vh}
.btn{padding:calc(1.7vh * var(--ui)) calc(6vh * var(--ui))}
.btn.ghost{padding:calc(1.4vh * var(--ui)) calc(3.2vh * var(--ui))}
.gear,.brand{padding:calc(1.3vh * var(--ui)) calc(3.2vh * var(--ui))}
.abort{padding:calc(1.2vh * var(--ui)) calc(2.6vh * var(--ui))}
/* ボタン行の間隔（14px固定だったもの） */
.pc > div[style*="gap:14px"]{gap:4vh !important}
/* 設定画面：項目を2列に並べて、1項目を大きくしても縦に収まるようにする */
#setScreen .pc{max-width:92vw !important;display:grid;grid-template-columns:1fr 1fr;column-gap:7vh;align-content:center;padding-top:1vh}
#setScreen .setTitle{margin-bottom:1.6vh}
#setScreen .setTitle,#setScreen .setNote{grid-column:1/-1}
#setScreen .setNote{margin-top:1vh}
@media (max-width:1100px){#setScreen .pc{grid-template-columns:1fr}}
/* タイトル画面の「ホーム」は左上ではなく下のボタン行へ。左上の .brand は使わない */
.brand{display:none}
/* かざし続けて確定（dwell）の進捗バー：要素の下辺に細く */
.opt,.tok{--dw:0}
.dwelling::after{content:'';position:absolute;left:10%;right:10%;bottom:7%;height:.9vh;border-radius:100px;
  background:linear-gradient(90deg,var(--tl) calc(var(--dw)*100%),transparent calc(var(--dw)*100%));
  pointer-events:none;z-index:1}
.tok.dwelling{transform:scale(1.04)}

/* ---- ホーム画面のタッチレス対応 ---- */
.card,.nav{position:relative}
.card::before{content:'';position:absolute;inset:-1vh -.8vh;border-radius:inherit}
.nav::before{content:'';position:absolute;inset:-2.2vh;border-radius:50%}
.dots i{position:relative}
.dots i::before{content:'';position:absolute;inset:-1.4vh;border-radius:50%}
.tut{display:inline-block;margin:2.2vh auto 0;font-family:var(--fJP);font-weight:900;
  font-size:clamp(14px,calc(2.2vh * var(--ui)),57px);color:var(--ink);background:var(--panel);
  border:var(--bw) solid var(--stroke);border-radius:100px;padding:1.3vh 3.6vh;cursor:pointer;
  box-shadow:var(--hard-sm);transition:transform .12s,box-shadow .12s}
.tut:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--stroke)}
.tut small{font-weight:500;color:var(--dim);margin-right:1.2vh}
.wrap .pc{max-width:92vw}
.bgmBtn{position:absolute;top:2.6vh;right:4vh;z-index:20;font-family:var(--fJP);font-weight:900;
  font-size:clamp(15px,calc(2.3vh * var(--ui)),59px);color:var(--ink);background:var(--panel);
  border:var(--bw) solid var(--stroke);border-radius:100px;padding:1.3vh 3.2vh;cursor:pointer;
  box-shadow:var(--hard-sm);transition:transform .12s,box-shadow .12s}
.bgmBtn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--stroke)}
</style>
</head>
<body data-theme="light">
<script>
/* ============================================================
   TOUCHLESS LAYER (JS)
   Trouvezの空間デバイスはマウス／タッチ相当のイベントを送ってくる前提。
   ここでは次の4つを面倒みる。
     1. ポインタ球体   … 動きを検知したときだけ現れ、止まると薄れて消える
     2. 空振りの吸着   … 操作対象の外側を押しても、近くの対象へ届ける
     3. 連打の抑制     … 同じ対象への短時間の連打は1回に丸める
     4. 中断ボタン     … 「かざし続けた時間」で判定（デバイスからは連打として届く）
   URL: ?pointer=0 で球体を消せる
   ============================================================ */
window.TL=(function(){
  const QP=new URLSearchParams(location.search);
  // 大画面向けの拡大率。?ui=1.4 のように上書きできる（0.8〜2.0）
  if(QP.get('ui')){const u=parseFloat(QP.get('ui'));if(u>=0.8&&u<=2)document.documentElement.style.setProperty('--ui',u);}
  const CFG={
    pointer: QP.get('pointer')!=='0',
    idleMs: 900,       // 動きが止まってから球体が消えるまで
    snapVh: 7,         // 空振りを吸着する半径（画面高さ比）
    debounceMs: 360,   // 同じ対象への連打を無視する時間
    abortMs: 600,      // 中断に必要な「かざし続け」の時間
    abortGap: 400,     // クリックの間隔がこれより空いたら手が離れたとみなす
    dwellMs: 350,      // 密集した対象（設定の選択肢・MEMORY PATH のマス）で、かざし続けて確定するまでの時間
    dwellGap: 300,     // クリックの間隔がこれより空いたら手が離れたとみなす（dwell用）
    dwell: QP.get('dwell')!=='0'   // ?dwell=0 でマウス検証用に即時反応へ
  };
  /* 操作対象。ゲーム側で増やすときは data-hit を付けるだけでよい */
  const SEL='.btn,.opt,.rp,.gear,.brand,.abort,.target,.tok.tappable,.mole,[data-hit]';
  const CLICKY='.btn,.opt,.rp,.gear,.brand,[data-hit=click]';   // onclick で動くもの
  const DWELL='.opt,.tok.tappable,[data-dwell]';                 // かざし続けて確定するもの
  const vh=()=>innerHeight/100;

  /* ---------- 1. ポインタ球体 ---------- */
  let ptr=null,core=null,idleT=null;
  function ensurePtr(){
    if(ptr||!CFG.pointer)return;
    ptr=document.createElement('div');ptr.className='tlPointer';
    core=document.createElement('div');core.className='tlCore';
    ptr.appendChild(core);document.body.appendChild(ptr);
  }
  function movePtr(x,y){
    if(!CFG.pointer)return;ensurePtr();
    ptr.style.transform='translate('+x+'px,'+y+'px)';
    ptr.classList.add('on');
    clearTimeout(idleT);idleT=setTimeout(()=>ptr.classList.remove('on'),CFG.idleMs);
  }
  function ripple(x,y){
    if(!CFG.pointer)return;
    const r=document.createElement('div');r.className='tlRipple';
    r.style.left=x+'px';r.style.top=y+'px';
    document.body.appendChild(r);setTimeout(()=>r.remove(),600);
  }
  document.addEventListener('pointermove',e=>movePtr(e.clientX,e.clientY),{passive:true});
  document.addEventListener('pointerdown',e=>{
    movePtr(e.clientX,e.clientY);ripple(e.clientX,e.clientY);
    if(ptr){ptr.classList.add('down');setTimeout(()=>ptr.classList.remove('down'),140);}
  },{capture:true,passive:true});
  document.addEventListener('pointerleave',()=>{if(ptr)ptr.classList.remove('on');});
  document.addEventListener('pointerout',e=>{if(!e.relatedTarget&&ptr)ptr.classList.remove('on');});

  /* ---------- 2. 吸着  3. 連打抑制 ---------- */
  function visible(el){
    const cs=getComputedStyle(el);
    if(cs.display==='none'||cs.visibility==='hidden'||cs.pointerEvents==='none'||+cs.opacity<0.05)return false;
    const r=el.getBoundingClientRect();
    if(r.width<2||r.height<2)return false;
    // 他の画面（オーバーレイ等）の下敷きになっていないか
    const top=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);
    return !!top&&(top===el||el.contains(top));
  }
  function nearest(x,y){
    const R=CFG.snapVh*vh();let best=null,bd=R;
    document.querySelectorAll(SEL).forEach(el=>{
      if(!visible(el))return;
      const r=el.getBoundingClientRect();
      const dx=Math.max(r.left-x,0,x-r.right), dy=Math.max(r.top-y,0,y-r.bottom);
      const d=Math.hypot(dx,dy);
      if(d<bd){bd=d;best=el;}
    });
    return best;
  }
  let lastDownEl=null,lastDownT=0,lastClickEl=null,lastClickT=0;
  function forward(el,e){
    const ev=new PointerEvent('pointerdown',{bubbles:true,cancelable:true,
      clientX:e.clientX,clientY:e.clientY,pointerType:e.pointerType||'mouse',
      pointerId:e.pointerId,isPrimary:true,button:0,buttons:1});
    el.dispatchEvent(ev);
    if(el.matches(CLICKY)){
      const n=performance.now();
      if(el===lastClickEl&&n-lastClickT<CFG.debounceMs)return;
      lastClickEl=el;lastClickT=n;el.click();
    }
  }
  /* ---------- 2b. かざし続けて確定（dwell） ----------
     密集した対象は、通りがかりの一瞬の反応で押さないよう、dwellMs のあいだ
     手がとどまって（＝クリックが続いて／押し続けて）いたときだけ確定する。
     進捗は要素の下辺に細いバーで出す */
  const dw={el:null,start:0,lastTap:0,held:false,fired:false,raf:0};
  function dwellClear(){
    if(dw.el){dw.el.classList.remove('dwelling');dw.el.style.removeProperty('--dw');}
    dw.el=null;dw.fired=false;
  }
  function dwellFire(el,e){
    const n=performance.now();lastDownEl=el;lastDownT=n;
    forward(el,e);
  }
  function dwellTouch(el,e){
    const n=performance.now();
    if(dw.el!==el){dwellClear();dw.el=el;dw.start=n;dw.fired=false;el.classList.add('dwelling');}
    dw.lastTap=n;dw.held=true;dw.ev=e;
    if(!dw.raf)dwellTick();
  }
  function dwellTick(){
    dw.raf=requestAnimationFrame(()=>{
      dw.raf=0;if(!dw.el)return;
      const n=performance.now();
      if(!dw.held&&n-dw.lastTap>CFG.dwellGap){dwellClear();return;}   // 手が離れた
      // 進捗は「手がいた証拠」の時刻で測る：押し続け中なら今、連打なら最後のクリック時刻。
      // こうしないと gap の猶予ぶんが上乗せされ、通りがかりの2クリックで確定してしまう
      const p=Math.min(1,((dw.held?n:dw.lastTap)-dw.start)/CFG.dwellMs);
      dw.el.style.setProperty('--dw',p);
      if(p>=1&&!dw.fired){dw.fired=true;dwellFire(dw.el,dw.ev);dw.el.classList.remove('dwelling');}
      dwellTick();
    });
  }
  const dwRelease=()=>{dw.held=false;};
  document.addEventListener('pointerup',dwRelease,true);
  document.addEventListener('pointercancel',dwRelease,true);

  document.addEventListener('pointerdown',e=>{
    if(!e.isTrusted)return;
    if(e.target.closest&&e.target.closest('.court,[data-nosnap]'))return;
    const n=performance.now();
    const el=e.target.closest&&e.target.closest(SEL);
    if(CFG.dwell){
      const d=el&&el.matches(DWELL)?el:(!el?nearest(e.clientX,e.clientY):null);
      if(d&&d.matches(DWELL)){e.stopPropagation();e.preventDefault();dwellTouch(d,e);return;}
    }
    if(el){
      if(!el.matches('.abort')&&el===lastDownEl&&n-lastDownT<CFG.debounceMs){
        e.stopPropagation();e.preventDefault();return;      // 連打の2発目以降は捨てる
      }
      lastDownEl=el;lastDownT=n;return;
    }
    const cand=nearest(e.clientX,e.clientY);
    if(cand){e.stopPropagation();e.preventDefault();lastDownEl=cand;lastDownT=n;forward(cand,e);}
  },true);
  document.addEventListener('click',e=>{
    if(!e.isTrusted)return;
    // dwell対象の click は本物を捨て、dwell 完了時の合成 click だけ通す
    if(CFG.dwell&&e.target.closest&&e.target.closest(DWELL)){e.stopPropagation();e.preventDefault();return;}
    const el=e.target.closest&&e.target.closest(CLICKY);if(!el)return;
    const n=performance.now();
    if(el===lastClickEl&&n-lastClickT<CFG.debounceMs){e.stopPropagation();e.preventDefault();return;}
    lastClickEl=el;lastClickT=n;
  },true);

  /* 中断直後の保護：手が離れて（クリックが止まって）から 800ms 経つまで、同じ位置のボタンを無効化 */
  let cdT=null;
  function cooldown(){
    document.body.classList.add('tlCooldown');
    clearTimeout(cdT);cdT=setTimeout(()=>document.body.classList.remove('tlCooldown'),800);
  }
  document.addEventListener('pointerdown',()=>{if(document.body.classList.contains('tlCooldown'))cooldown();},true);

  /* ---------- 4. 中断ボタン ---------- */
  /* 利用者の動作は「かざし続ける」。マウスなら押し続け、空間デバイスからは連打として届く。どちらでも ms だけ続けば発火 */
  function bindAbort(btn,fill,onAbort,opt){
    const ms=(opt&&opt.ms)||CFG.abortMs, gap=(opt&&opt.gap)||CFG.abortGap;
    let start=null,lastTap=0,held=false,raf=0;
    fill.style.transition='none';
    btn.addEventListener('pointerdown',e=>{
      e.preventDefault();e.stopPropagation();
      const n=performance.now();held=true;
      if(start===null)start=n;
      lastTap=n;if(!raf)tick();
    });
    const release=()=>{held=false;};
    document.addEventListener('pointerup',release,true);
    document.addEventListener('pointercancel',release,true);
    function tick(){
      raf=requestAnimationFrame(()=>{
        raf=0;if(start===null)return;
        const n=performance.now();
        if(!held&&n-lastTap>gap){start=null;fill.style.width='0%';return;}
        const p=((held?n:lastTap)-start)/ms;          // dwell と同じく「手がいた証拠」の時刻で測る
        fill.style.width=Math.min(100,p*100)+'%';
        if(p>=1){
          start=null;held=false;fill.style.width='0%';
          // 中断直後も手はかざされたまま。同じ場所に現れる「ホーム」等を誤爆しないよう少し眠らせる
          cooldown();
          onAbort();return;
        }
        tick();
      });
    }
    return {reset(){start=null;held=false;fill.style.width='0%';}};
  }

  /* ---------- 5. 設定の保存 ----------
     .opt を押すたびに localStorage へ保存。ペース・二重課題・画面・効果音・BGM は全ゲーム共通、
     それ以外（問題数・穴の数・回答方式・ボール）はページごと。URLの ?pace= 等はこれより優先 */
  const SHARED=['segPace','segDT','segTheme','segSfx','segBgm'];
  const page=(location.pathname.split('/').pop()||'index.html');
  const key=g=>SHARED.includes(g)?'cognify.shared':'cognify.'+page;
  const load=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}');}catch(e){return {};}};
  function saveOpt(btn){
    const grp=btn.closest('.optRow');if(!grp||!grp.id)return;
    const k=key(grp.id),o=load(k);o[grp.id]=btn.dataset.v;
    try{localStorage.setItem(k,JSON.stringify(o));}catch(e){}
  }
  document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.opt');if(b)saveOpt(b);});
  function restoreSettings(){
    const all=Object.assign({},load('cognify.'+page),load('cognify.shared'));
    Object.keys(all).forEach(g=>{
      const grp=document.getElementById(g);if(!grp)return;
      const b=grp.querySelector('.opt[data-v="'+all[g]+'"]');
      if(b&&!b.classList.contains('on'))b.click();
    });
  }
  /* URLの指定（?pace=fast 等）を保存済み設定より優先させるため、復元のあとにもう一度当てる */
  const QMAP=[['size','segSize'],['pace','segPace'],['dt','segDT'],['theme','segTheme'],['holes','segHoles'],['mode','segMode'],
              ['sfx','segSfx',v=>v==='1'?'on':'off'],['bgm','segBgm',v=>v==='1'?'on':'off'],['occ','segOcc',v=>v==='1'?'on':'off']];
  function applyQueryOverride(){
    QMAP.forEach(([q,g,f])=>{
      if(!QP.has(q))return;const grp=document.getElementById(g);if(!grp)return;
      const v=f?f(QP.get(q)):QP.get(q);const b=grp.querySelector('.opt[data-v="'+v+'"]');
      if(b&&!b.classList.contains('on'))b.click();
    });
  }
  function clearSettings(){try{localStorage.removeItem('cognify.shared');localStorage.removeItem('cognify.'+page);}catch(e){}}

  return {cfg:CFG,bindAbort,movePtr,ripple,restoreSettings,applyQueryOverride,clearSettings};
})();
</script>
<script>const AMBIENT_FILE='';   // SUNO等の音声ファイルを使うならここにファイル名（同じフォルダに置く）</script>
<script>
/* ============================================================
   AMBIENT BGM — ホーム／練習用の環境音（手続き生成）
   明るい和音のパッドに、やわらかな分散和音のきらめき。ドラムはない。
   ・ブラウザの自動再生制限により、最初のクリック（空間デバイスの反応）で鳴り始める
   ・AMBIENT_FILE に音声ファイルのURLを入れると、生成音の代わりにそれをループ再生する
     （SUNO等で作った曲を使う場合はここ。同じフォルダに置いて 'ambient.mp3' のように）
   ・?bgm=0 で無効
   ============================================================ */
window.AMBIENT=(function(){
  const QP=new URLSearchParams(location.search);
  const FILE=(typeof AMBIENT_FILE==='string'&&AMBIENT_FILE)||QP.get('bgmfile')||'';
  let enabled=QP.get('bgm')!=='0', playing=false, actx=null, master=null, timer=null, audioEl=null;
  let next=0, step=0;

  /* 和音は8小節でひと回り。すべて長三和音系（add9 / maj7 / 6）で、高めの音域に置く */
  const CHORDS=[[261.63,329.63,392.00,587.33],[349.23,440.00,523.25,659.25],   // Cadd9  Fmaj7
                [392.00,493.88,587.33,659.25],[261.63,329.63,392.00,523.25],   // G6     C
                [349.23,440.00,523.25,783.99],[392.00,493.88,587.33,783.99],   // Fadd9  G
                [329.63,392.00,523.25,659.25],[261.63,392.00,523.25,587.33]];  // C/E    Cadd9
  const BELLS=[783.99,880.00,1046.50,1174.66,1318.51,1567.98];
  const BAR=4.8;   // 1和音あたりの秒数
  const PULSE=0.3; // 分散和音の間隔（秒）＝ 100bpm の8分

  function AC(){
    if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)();
      master=actx.createGain();master.gain.value=0;master.connect(actx.destination);}
    if(actx.state==='suspended')actx.resume();return actx;
  }
  function pad(t,freqs){
    const a=AC();
    freqs.forEach((f,i)=>{
      [0,0.4].forEach(det=>{                 // わずかにずらした2本で厚みを出す
        const o=a.createOscillator(),g=a.createGain(),lp=a.createBiquadFilter();
        o.type=i===0?'sine':'triangle';o.frequency.value=f;o.detune.value=det*8-2;
        lp.type='lowpass';lp.frequency.value=1500;
        const v=(i===0?0.07:0.045)*(det?0.7:1);
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+BAR*0.45);
        g.gain.linearRampToValueAtTime(v*0.8,t+BAR*0.8);
        g.gain.linearRampToValueAtTime(0.0001,t+BAR*1.15);
        o.connect(lp);lp.connect(g);g.connect(master);o.start(t);o.stop(t+BAR*1.2);
      });
    });
  }
  /* 鈴は金属的に聞こえやすいので、低めの音域・遅い立ち上がり・小さな音量にする */
  function bell(t,f){
    const a=AC(),o=a.createOscillator(),g=a.createGain(),lp=a.createBiquadFilter();
    o.type='sine';o.frequency.value=f/2;lp.type='lowpass';lp.frequency.value=1200;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.014,t+0.12);
    g.gain.exponentialRampToValueAtTime(0.0001,t+2.6);
    o.connect(lp);lp.connect(g);g.connect(master);o.start(t);o.stop(t+2.7);
  }
  /* やわらかい撥弦。分散和音でゆるやかな前進感を作る */
  /* 撥弦は丸く。サイン波主体、立ち上がりをなだらかに、高域を切る */
  function pluck(t,f,v){
    const a=AC(),o=a.createOscillator(),g=a.createGain(),lp=a.createBiquadFilter();
    o.type='sine';o.frequency.value=f;lp.type='lowpass';lp.frequency.value=1300;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+0.04);
    g.gain.exponentialRampToValueAtTime(0.0001,t+1.1);
    o.connect(lp);lp.connect(g);g.connect(master);o.start(t);o.stop(t+0.95);
  }
  function schedule(){
    const a=AC();
    while(next<a.currentTime+0.5){
      const bar=step%8, t=next, ch=CHORDS[bar];
      pad(t,ch);
      // 分散和音：上昇形と下降形を小節ごとに入れ替え、1拍おきに抜いて軽くする
      const n=Math.floor(BAR/PULSE), up=bar%2===0;
      for(let k=0;k<n;k++){
        if(k%4===3)continue;
        const idx=up?k%ch.length:(ch.length-1-k%ch.length);
        pluck(t+k*PULSE,ch[idx],k%4===0?0.045:0.03);
      }
      // 鈴はときどき
      const nb=[1,0,0,1,0,1,0,1][bar];
      for(let k=0;k<nb;k++) bell(t+0.6+Math.random()*(BAR-1.2),BELLS[(bar*2+k*3+step)%BELLS.length]);
      next+=BAR;step++;
    }
  }
  function start(){
    if(!enabled||playing)return;playing=true;
    if(FILE){
      audioEl=new Audio(FILE);audioEl.loop=true;audioEl.volume=0;
      audioEl.play().then(()=>{let v=0;const iv=setInterval(()=>{v=Math.min(0.5,v+0.02);audioEl.volume=v;if(v>=0.5)clearInterval(iv);},80);})
        .catch(()=>{playing=false;});
      return;
    }
    const a=AC();
    master.gain.linearRampToValueAtTime(0.6,a.currentTime+3);
    next=a.currentTime+0.05;step=0;timer=setInterval(schedule,200);
  }
  function stop(){
    if(!playing)return;playing=false;
    if(audioEl){audioEl.pause();audioEl=null;return;}
    clearInterval(timer);
    try{master.gain.linearRampToValueAtTime(0,actx.currentTime+1.2);}catch(e){}
  }
  function toggle(){enabled=!enabled;if(enabled)start();else stop();return enabled;}
  // 読み込み直後に開始を試みる。ブラウザが自動再生を許している環境
  // （キオスク起動オプション、またはこのサイトで既に操作済み）ならそのまま鳴る。
  // 許されていなければ AudioContext が suspended のまま待ち、最初の操作で鳴り始める。
  function kick(){ if(enabled&&!FILE){start();try{actx.resume();}catch(e){}} else if(enabled&&FILE&&!playing) start(); }
  if(document.readyState==='complete') kick(); else window.addEventListener('load',kick);
  ['pointerdown','keydown','pointermove'].forEach(ev=>document.addEventListener(ev,kick,{capture:true,passive:true}));
  return {start,stop,toggle,get enabled(){return enabled;},get playing(){return playing;}};
})();
</script>

<script>
(function(){
const ICONS={
  rule:'<svg class="cIcon" viewBox="0 0 64 64" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">'+
    '<circle cx="16" cy="17" r="10" stroke="currentColor"/>'+
    '<path d="M34 17h22" stroke="currentColor"/><path d="M51 12l5 5-5 5" stroke="currentColor"/>'+
    '<rect x="38" y="37" width="20" height="20" rx="5" stroke="currentColor"/>'+
    '<path d="M30 47H8" stroke="currentColor"/><path d="M13 42l-5 5 5 5" stroke="currentColor"/></svg>',
  memory:'<svg class="cIcon" viewBox="0 0 64 64" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">'+
    '<path d="M12 50l14-16 12 10 14-24" stroke="currentColor"/>'+
    '<circle cx="12" cy="50" r="6" fill="currentColor"/>'+
    '<circle cx="26" cy="34" r="6" stroke="currentColor"/>'+
    '<circle cx="38" cy="44" r="6" stroke="currentColor"/>'+
    '<circle cx="52" cy="20" r="6" stroke="currentColor"/></svg>',
  gonogo:'<svg class="cIcon" viewBox="0 0 64 64" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">'+
    '<circle cx="21" cy="32" r="13" fill="currentColor"/>'+
    '<circle cx="46" cy="32" r="13" stroke="currentColor"/>'+
    '<path d="M37 41l18-18" stroke="currentColor"/></svg>',
  mogura:'<svg class="cIcon" viewBox="0 0 64 64" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">'+
    '<path d="M6 50h30" stroke="currentColor"/>'+
    '<path d="M11 50a10 10 0 0 1 20 0" stroke="currentColor"/>'+
    '<circle cx="17" cy="43" r="2.6" fill="currentColor"/><circle cx="25" cy="43" r="2.6" fill="currentColor"/>'+
    '<rect x="40" y="11" width="18" height="12" rx="3" stroke="currentColor"/>'+
    '<path d="M49 23v21" stroke="currentColor"/></svg>',
  tennis:'<svg class="cIcon" viewBox="0 0 64 64" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">'+
    '<ellipse cx="24" cy="22" rx="15" ry="17" stroke="currentColor"/>'+
    '<path d="M18 37L10 54" stroke="currentColor"/>'+
    '<circle cx="49" cy="45" r="9" stroke="currentColor"/></svg>'
};

/* ここに足せばカードが増えます。ready:false は「準備中」表示 */
const GAMES=[
  {cls:'a', icon:'rule',   name:'RULE SWITCH', skill:'認知的柔軟性', file:'rule-switch.html',
   desc:'ルールが途中で変わる。', ready:true},
  {cls:'b', icon:'memory', name:'MEMORY PATH', skill:'作業記憶', file:'memory-path.html',
   desc:'光った順番をたどる。', ready:true},
  {cls:'c', icon:'gonogo', name:'GO / NO-GO', skill:'抑制', file:'spatial-gonogo.html',
   desc:'出たら押す。でも、時々がまん。', ready:true},
  {cls:'d', icon:'mogura', name:'MOGURA', skill:'抑制と処理速度', file:'mogura.html',
   desc:'出てきたら、たたく。', ready:true},
  {cls:'e', icon:'tennis', name:'TENNIS', skill:'予測とタイミング', file:'tennis.html',
   desc:'弾んだ先へ、先回り。', ready:true}
];

const $=x=>document.getElementById(x);
const track=$('track'),dots=$('dots');

track.innerHTML=GAMES.map((g,i)=>`
  <div class="card ${g.cls}${g.ready?'':' soon'}" data-i="${i}"${g.ready?' data-hit="click"':''}>
    <div class="cHead">${ICONS[g.icon]}<div class="cName">${g.name}</div></div>
    <div class="cSkill">${g.skill}</div>
    <div class="cDesc">${g.desc}</div>
    <div class="cGo">${g.ready?'スタート':'準備中'}</div>
  </div>`).join('');

const cards=[...track.querySelectorAll('.card')];
cards.forEach(c=>{
  const g=GAMES[+c.dataset.i];
  if(!g.ready)return;
  c.onclick=()=>{
    const home=location.pathname.split('/').pop()||'index.html';
    location.href=g.file+'?home='+encodeURIComponent(home);
  };
});

/* 点の数は「カードの枚数」ではなく「スクロールできる位置の数」。
   1度に3枚見えているなら 5-3+1 = 3通りしか止まる場所がない。
   見える枚数は画面幅で変わるので、その都度かぞえ直す。 */
function stride(){
  return cards[1] ? cards[1].offsetLeft-cards[0].offsetLeft : cards[0].offsetWidth;
}
function visibleCount(){
  return Math.max(1,Math.min(cards.length,Math.round(track.clientWidth/stride())));
}
function pageCount(){
  return Math.max(1,cards.length-visibleCount()+1);
}
function buildDots(){
  const n=pageCount();
  dots.style.display = n>1 ? 'flex' : 'none';
  dots.innerHTML=Array.from({length:n},(_,i)=>'<i data-i="'+i+'" data-hit="click"></i>').join('');
  dots.querySelectorAll('i').forEach(p=>p.onclick=()=>go(+p.dataset.i));
}
function go(i){
  const c=cards[i];if(!c)return;
  track.scrollTo({left:c.offsetLeft-cards[0].offsetLeft,behavior:'smooth'});
}
function current(){
  return Math.max(0,Math.min(pageCount()-1,Math.round(track.scrollLeft/stride())));
}
function sync(){
  const i=current();
  dots.querySelectorAll('i').forEach((p,k)=>p.classList.toggle('on',k===i));
  $('prev').disabled = track.scrollLeft<=2;
  $('next').disabled = track.scrollLeft>=track.scrollWidth-track.clientWidth-2;
}
$('prev').onclick=()=>go(Math.max(0,current()-1));
$('next').onclick=()=>go(Math.min(pageCount()-1,current()+1));
track.addEventListener('scroll',()=>{clearTimeout(track._t);track._t=setTimeout(sync,80)});
window.addEventListener('resize',()=>{buildDots();sync();});
$('bgmBtn').onclick=()=>{$('bgmBtn').textContent=AMBIENT.toggle()?'♪ BGM ON':'♪ BGM OFF';};
$('tutBtn').onclick=()=>{
  const home=location.pathname.split('/').pop()||'index.html';
  location.href='tutorial.html?home='+encodeURIComponent(home);
};
buildDots();
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')$('next').click();
  if(e.key==='ArrowLeft')$('prev').click();
});
sync();
})();
</script>
